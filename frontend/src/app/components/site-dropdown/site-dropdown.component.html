<div class="site-dropdown-wrapper">
  <!-- Trigger Button -->
  <button class="site-dropdown-trigger" (click)="toggle()" type="button">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
      <circle cx="12" cy="10" r="3"/>
    </svg>
    <span>{{ selectedLabel }}</span>
    <svg class="chevron" [class.open]="isOpen" width="12" height="12" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.5">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>

  <!-- Panel: daftar site datar + pencarian -->
  <div class="dropdown-panel" [class.align-right]="panelAlign === 'right'" *ngIf="isOpen">
    <input
      class="site-search"
      type="text"
      name="siteSearch"
      [(ngModel)]="search"
      placeholder="Cari site atau proyek..."
      autocomplete="off">

    <div class="dropdown-list">
      <button
        type="button"
        class="dropdown-item"
        *ngFor="let site of filteredSites"
        (click)="select(site)">
        <span class="site-name">{{ site.label }}</span>
        <span class="site-project">{{ site.project }}</span>
      </button>

      <div class="dropdown-empty" *ngIf="filteredSites.length === 0">
        Site tidak ditemukan
      </div>
    </div>
  </div>
</div>
