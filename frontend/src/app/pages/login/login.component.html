<div id="login-screen">
  <form class="login-card" (ngSubmit)="onLogin()">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <polyline points="0,11 5,11 7,3 10,19 12,11 22,11" fill="none" stroke="#3E3A6B" stroke-width="2"/>
      </svg>
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;">Nadi</span>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:22px;">Monitoring jaringan &amp; infrastruktur</div>

    <div style="font-size:12px;color:#4B5563;margin-bottom:4px;">Nama pengguna</div>
    <input type="text" [(ngModel)]="username" name="username" placeholder="nama.pengguna" required>

    <div style="font-size:12px;color:#4B5563;margin-bottom:4px;">Kata sandi</div>
    <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>

    <div *ngIf="errorMsg" style="font-size:11.5px;color:#DC2626;margin-top:6px;text-align:center;">{{ errorMsg }}</div>
    <button type="submit" class="btn" style="width:100%;padding:10px;margin-top:4px;">Masuk</button>
    <div style="text-align:center;margin-top:14px;font-size:11px;color:var(--muted);">Lupa kata sandi? Hubungi admin EOS</div>
  </form>
</div>
